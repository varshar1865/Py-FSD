
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Blood Bank Management</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="register.css">
     <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <h1>🩸 Smart Blood Bank</h1>
    <p>Intelligent Donor Matching System</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#donor">Register Donor</a>
    <a href="#request">Blood Request</a>
    <a href="#match">Find Donors</a>
</nav>

<section id="home" class="hero">
    <h2>Donate Blood, Save Lives</h2>
    <p>Connecting donors with people in need.</p>
</section>

<main>

<section id="donor" class="card">
    <h2>Register as Donor</h2>

    <form id="donorForm">
        <input id="name" placeholder="Full Name" required>
        <input id="phone" placeholder="Phone Number" required>

        <select id="donorBlood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
        </select>

        <input id="donorLocation"
               placeholder="City / Location" required>

        <button type="submit">Register Donor</button>
    </form>
    <p id="donorMessage"></p>
</section>

<section id="request" class="card">
    <h2>Request Blood</h2>

    <form id="requestForm">
        <input id="patientName"
               placeholder="Patient Name" required>

        <select id="requestBlood" required>
            <option value="">Required Blood Group</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
        </select>

        <input id="requestLocation"
               placeholder="City / Location" required>

        <input id="units" type="number"
               min="1" placeholder="Units Required" required>

        <button type="submit">Submit Request</button>
    </form>
    <p id="requestMessage"></p>
</section>

<section id="match" class="card">
    <h2>Intelligent Donor Matching</h2>

    <select id="searchBlood">
        <option value="">Select Blood Group</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option>
        <option>O+</option><option>O-</option>
    </select>

    <input id="searchLocation"
           placeholder="Enter Location">

    <button onclick="findDonors()">Find Donors</button>

    <div id="results"></div>
</section>

</main>

<footer>
    <p>Smart Blood Bank Management System |
       College Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
